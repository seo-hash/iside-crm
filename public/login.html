<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accesso - CRM Iside</title>
<style>
  * { box-sizing: border-box; }

  @keyframes floatBlob {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -40px) scale(1.08); }
    66% { transform: translate(-25px, 25px) scale(0.95); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes logoPop {
    0% { opacity: 0; transform: scale(0.6) rotate(-8deg); }
    60% { opacity: 1; transform: scale(1.08) rotate(2deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  @keyframes logoFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 20% 20%, #1e293b 0%, #0f172a 55%, #060b18 100%);
    overflow: hidden;
    position: relative;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.35;
    animation: floatBlob 14s ease-in-out infinite;
    pointer-events: none;
  }
  .blob-1 {
    width: 420px; height: 420px;
    top: -120px; left: -100px;
    background: #2563eb;
  }
  .blob-2 {
    width: 380px; height: 380px;
    bottom: -140px; right: -100px;
    background: #7c3aed;
    animation-delay: -6s;
  }
  .blob-3 {
    width: 300px; height: 300px;
    bottom: 10%; left: 8%;
    background: #0ea5e9;
    animation-delay: -3s;
    opacity: 0.2;
  }

  .login-box {
    position: relative;
    z-index: 1;
    background: rgba(255, 255, 255, 0.98);
    padding: 2.5rem;
    border-radius: 16px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    animation: fadeUp 0.6s ease-out;
  }

  .logo-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 1rem;
  }
  .logo-wrap img {
    max-width: 140px;
    max-height: 100px;
    object-fit: contain;
    animation: logoPop 0.7s ease-out, logoFloat 3.5s ease-in-out 0.7s infinite;
  }

  h1 {
    margin: 0 0 0.25rem;
    font-size: 1.3rem;
    color: #0f172a;
    text-align: center;
  }
  .subtitle {
    margin: 0 0 1.5rem;
    font-size: 0.85rem;
    color: #64748b;
    text-align: center;
  }

  label { display: block; font-size: 0.85rem; margin-bottom: 0.3rem; color: #334155; }
  input {
    width: 100%;
    padding: 0.65rem 0.75rem;
    margin-bottom: 1rem;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 1rem;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  button {
    width: 100%;
    padding: 0.75rem;
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
  }
  button:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
  }
  button:active:not(:disabled) { transform: translateY(0); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

  .error {
    color: #dc2626;
    background: #fef2f2;
    border: 1px solid #fecaca;
    padding: 0.5rem 0.75rem;
    border-radius: 6px;
    font-size: 0.85rem;
    margin-bottom: 1rem;
    display: none;
  }
  .error.show {
    display: block;
    animation: shake 0.4s ease-in-out;
  }
</style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="login-box">
    <div class="logo-wrap">
      <img src="/public/assets/logo.png" alt="Iside">
    </div>
    <h1>CRM Iside</h1>
    <p class="subtitle">Accedi con le tue credenziali</p>
    <div id="error" class="error"></div>
    <form id="loginForm">
      <label for="username">Nome utente</label>
      <input type="text" id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit" id="submitBtn">Accedi</button>
    </form>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('error');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('show');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Accesso in corso...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();

        if (!res.ok) {
          errorBox.textContent = data.error || 'Errore di accesso.';
          errorBox.classList.add('show');
          return;
        }

        window.location.href = '/dashboard';
      } catch (err) {
        errorBox.textContent = 'Errore di connessione al server.';
        errorBox.classList.add('show');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Accedi';
      }
    });
  </script>
</body>
</html>
